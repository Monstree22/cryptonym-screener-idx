name: Update data screener

on:
  schedule:
    - cron: "30 9 * * 1-5"   # 16.30 WIB / 18.30 JST, Senin-Jumat
  workflow_dispatch:          # tombol "Run workflow" manual

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r screener/requirements.txt
      - name: Jalankan screener
        run: python screener/screener_idx.py --out /tmp/hasil --json data.json
      - name: Commit data baru
        run: |
          if git diff --quiet data.json; then
            echo "Data tidak berubah (hari libur bursa?)"
            exit 0
          fi
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add data.json
          git commit -m "data: update screener $(date -u +%F)"
          git push
